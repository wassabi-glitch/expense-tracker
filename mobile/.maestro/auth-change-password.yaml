appId: com.ahror2937.sarflog
---
- launchApp
- assertVisible: "Sign in to Sarflog"
- tapOn: "Enter your email"
- inputText: "test@example.com"
- tapOn: "Enter your password"
- inputText: "Password123!"
- tapOn: "Sign in"
- assertNotVisible: "Sign in to Sarflog"
- tapOn: "Settings"
- assertVisible: "Settings"
- tapOn: "Current password"
- inputText: "Password123!"
- tapOn: "New password"
- inputText: "NewPassword123!"
- tapOn: "Confirm new password"
- inputText: "NewPassword123!"
- tapOn: "Update Password"
- assertVisible: "Password updated successfully."
