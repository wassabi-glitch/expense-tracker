appId: com.ahror2937.sarflog
---
- launchApp:
    clearState: true

# Tap Forgot your password? link
- tapOn: { point: "83%,60%" }

# Should be on Forgot Password screen. Fill email.
- tapOn: { point: "50%,45%" }
- inputText: "forgot@example.com"

# Tap Send Reset Link
- tapOn: { point: "50%,60%" }

# Should show success or navigate back. Either way, app is still running.
