appId: com.ahror2937.sarflog
---
- runFlow:
    file: "helpers/login.yaml"
    env:
      EMAIL: "testuser@example.com"
      PASSWORD: "Password123!"

- tapOn: "Settings"

- assertVisible: "Change Password"
- tapOn: "Change Password"

# Maestro uses accessibility labels or text, so we can just use the placeholder or testID
- tapOn: 
    id: "current-password-input"
- inputText: "Password123!"

- tapOn: 
    id: "new-password-input"
- inputText: "NewStrongPassword456!"

- tapOn: 
    id: "confirm-password-input"
- inputText: "NewStrongPassword456!"

- tapOn: "Update Password"

# The toast message should show up or it redirects or resets the form
- assertVisible: "Password changed successfully."
