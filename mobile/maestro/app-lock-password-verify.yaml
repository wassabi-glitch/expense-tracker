# app-lock-password-verify.yaml
# Maestro E2E flow: After cooldown, verify password → create new PIN → unlock.
# This file is written for CI/physical-device testing but NOT run locally.
# Note: The 30-min cooldown is impractical for E2E. This test assumes
# the cooldown has already expired or is bypassed in a test build.

appId: com.ahror2937.sarflog
---
- clearState
- launchApp

# Password verification screen appears (after cooldown expiry)
- assertVisible: "Verify your identity"
- assertVisible: "Enter your Sarflog password to reset your PIN."

# Enter wrong password
- tapOn:
    id: "password-input"
- inputText: "wrong-password"
- hideKeyboard
- tapOn: "Verify"
- assertVisible: "Incorrect password."

# Enter correct password
- tapOn:
    id: "password-input"
- inputText: "TestPass123!"
- hideKeyboard
- tapOn: "Verify"

# Should transition to create PIN flow
- assertVisible: "Create your PIN"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"

- assertVisible: "Repeat your PIN"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"

- tapOn: "Later"

# App unlocked
- assertVisible: "Home"
