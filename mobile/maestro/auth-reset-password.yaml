appId: com.ahror2937.sarflog
---
- launchApp:
    clearState: true

# Maestro supports deep links. We mock navigating to the reset password page with a token.
# Note: Maestro might require the deep link to be registered in the app manifest.
- openLink: "sarflog://reset-password?token=mock_token_123"

- assertVisible: "Create new password"
- assertVisible: "Your new password must be different from previous used passwords."

- tapOn: "New password"
- inputText: "SafePass1!"
- hideKeyboard

- tapOn: "Reset password"

- assertVisible: "Password Reset!"
- assertVisible: "Your password has been reset successfully. Redirecting to sign in..."

- tapOn: "Continue to sign in"
- assertVisible: "Sign in to your account"
