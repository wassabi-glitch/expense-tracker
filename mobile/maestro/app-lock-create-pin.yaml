# app-lock-create-pin.yaml
# Maestro E2E flow: Sign in, create PIN, skip biometrics, verify app opens.
# This file is written for CI/physical-device testing but NOT run locally.

appId: com.ahror2937.sarflog
---
- clearState
- launchApp

# Sign in
- tapOn: "Sign in"
- tapOn:
    id: "email-input"
- inputText: "testuser@example.com"
- tapOn:
    id: "password-input"
- inputText: "TestPass123!"
- hideKeyboard
- tapOn:
    id: "sign-in-button"

# Create PIN flow — Phase 1
- assertVisible: "Create your PIN"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"

# Phase 2 — Repeat PIN
- assertVisible: "Repeat your PIN"
- tapOn: "1"
- tapOn: "2"
- tapOn: "3"
- tapOn: "4"
- tapOn: "5"

# Biometric offer dialog
- assertVisible: "Skip the code next time?"
- tapOn: "Later"

# Should now be in the main app
- assertVisible: "Home"
